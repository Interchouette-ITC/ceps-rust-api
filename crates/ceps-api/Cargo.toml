[package]
name = "ceps-api"
version.workspace = true
edition.workspace = true
description.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
license-file.workspace = true

[lib]
name = "ceps_api"
path = "src/lib.rs"

[[bin]]
name = "ceps-rust-api"
path = "src/main.rs"

[features]
default = [
  "ceps-all",
  "swagger-ui",
  "tx-return",
  "sign-local",
  "sign-kms",
  "chain-put",
  "custody",
]
swagger-ui = ["dep:utoipa-swagger-ui"]
cep18 = []
cep78 = []
cep85 = []
cep95 = []
ceps-all = ["cep18", "cep78", "cep85", "cep95"]
# Full demo set (same as package default). Prefer naming features explicitly in docs.
all = [
  "ceps-all",
  "swagger-ui",
  "tx-return",
  "sign-local",
  "sign-kms",
  "chain-put",
  "custody",
]
tx-return = []
sign-local = []
sign-kms = []
chain-put = []
custody = ["sign-local"]

[dependencies]
actix-web = { workspace = true }
actix-cors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true, optional = true }
thiserror = { workspace = true }
dotenvy = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
ceps-client = { workspace = true }
casper-rust-wasm-sdk = { workspace = true }

[dev-dependencies]
actix-web = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
wiremock = "0.6"
reqwest = { workspace = true }
serde_json = { workspace = true }
