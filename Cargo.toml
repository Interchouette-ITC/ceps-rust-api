[workspace]
members = ["crates/ceps-api"]
default-members = ["crates/ceps-api"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Interchouette <contact@interchouette.net>"]
description = "HTTP API for Casper CEP-18, CEP-78, CEP-85, and CEP-95 (optional local or KMS signing)."
readme = "README.md"
homepage = "https://github.com/Interchouette-ITC/ceps-rust-api"
repository = "https://github.com/Interchouette-ITC/ceps-rust-api"
license-file = "LICENSE"

[workspace.dependencies]
actix-web = { version = "4.14", default-features = false, features = [
    "macros",
] }
actix-cors = { version = "0.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
thiserror = "2"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "rustls",
] }
parking_lot = "0.12"
ceps-client = { git = "https://github.com/Interchouette-ITC/ceps-rust-ts-client", branch = "dev" }


[patch.crates-io]
casper-client = { version = "5", git = "https://github.com/casper-ecosystem/casper-client-rs", branch = "dev" }
casper-types = { git = "https://github.com/casper-network/casper-node", tag = "v2.2.2" }

[profile.release]
codegen-units = 1
lto = true
