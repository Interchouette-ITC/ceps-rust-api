[package]
name = "ceps-rust-api-mcp"
version = "1.0.0"
edition = "2021"
authors = ["Interchouette <contact@interchouette.net>"]
rust-version = "1.85"
license = "MIT"
description = "MCP server for ceps-rust-api (stdio + Streamable HTTP)"
readme = "README.md"

# Standalone package (not a member of the repo workspace).
[workspace]

[[bin]]
name = "ceps-rust-api-mcp"
path = "src/main.rs"

[lib]
name = "ceps_rust_api_mcp"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
mcpkit = "0.7"
mcpkit-axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde_json = "1"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "time",
    "fs",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "s"
