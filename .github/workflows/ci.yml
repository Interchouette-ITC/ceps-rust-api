name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: pem-ban
        run: make pem-ban
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: env -u CARGO_TARGET_DIR cargo clippy -p ceps-api --features all,swagger-ui -- -D warnings -D clippy::all -D clippy::pedantic
      - name: test
        run: env -u CARGO_TARGET_DIR cargo test -p ceps-api --features all,swagger-ui -- --nocapture
