name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  CARGO_TERM_COLOR: always
  FEATURES: ceps-all,swagger-ui,tx-return,sign-local,sign-kms,chain-put

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ceps-rust-api
    steps:
      - name: Checkout ceps-rust-api
        uses: actions/checkout@v4
        with:
          path: ceps-rust-api
      - name: Checkout ceps-rust-ts-client
        uses: actions/checkout@v4
        with:
          repository: Interchouette-ITC/ceps-rust-ts-client
          path: ceps-rust-ts-client
          ref: dev
      - name: Checkout casper-rust-wasm-sdk
        uses: actions/checkout@v4
        with:
          repository: casper-ecosystem/casper-rust-wasm-sdk
          path: rustSDK
          ref: dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ceps-rust-api
      - name: pem-ban
        run: make pem-ban
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: env -u CARGO_TARGET_DIR cargo clippy -p ceps-rust-api --features ${{ env.FEATURES }} -- -D warnings -D clippy::all
      - name: test
        run: env -u CARGO_TARGET_DIR cargo test -p ceps-rust-api --features ${{ env.FEATURES }} -- --nocapture
      - name: feature-slices
        run: make verify-slices

  preview:
    needs: lint-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ceps-rust-api
    steps:
      - name: Checkout ceps-rust-api
        uses: actions/checkout@v4
        with:
          path: ceps-rust-api
      - name: Checkout ceps-rust-ts-client
        uses: actions/checkout@v4
        with:
          repository: Interchouette-ITC/ceps-rust-ts-client
          path: ceps-rust-ts-client
          ref: dev
      - name: Checkout casper-rust-wasm-sdk
        uses: actions/checkout@v4
        with:
          repository: casper-ecosystem/casper-rust-wasm-sdk
          path: rustSDK
          ref: dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ceps-rust-api
      - name: Release binary
        run: env -u CARGO_TARGET_DIR cargo build --release -p ceps-rust-api --features ${{ env.FEATURES }}
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceps-rust-api-${{ github.sha }}
          path: ceps-rust-api/target/release/ceps-rust-api
          if-no-files-found: error
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg FEATURES=${{ env.FEATURES }} \
            -t interchouette/ceps-rust-api:ci-${{ github.sha }} \
            ..
      - name: Save image artifact
        run: docker save interchouette/ceps-rust-api:ci-${{ github.sha }} | gzip > /tmp/ceps-rust-api-image.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ceps-rust-api-image-${{ github.sha }}
          path: /tmp/ceps-rust-api-image.tar.gz
          if-no-files-found: error

  # Ops glue (docker + fund/export scripts) then Rust live_* integration tests.
  live:
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ceps-rust-api
    steps:
      - name: Checkout ceps-rust-api
        uses: actions/checkout@v4
        with:
          path: ceps-rust-api
      - name: Checkout ceps-rust-ts-client
        uses: actions/checkout@v4
        with:
          repository: Interchouette-ITC/ceps-rust-ts-client
          path: ceps-rust-ts-client
          ref: dev
      - name: Checkout casper-rust-wasm-sdk
        uses: actions/checkout@v4
        with:
          repository: casper-ecosystem/casper-rust-wasm-sdk
          path: rustSDK
          ref: dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ceps-rust-api
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Start NCTL
        run: |
          docker rm -f casper-nctl-2-docker-ci >/dev/null 2>&1 || true
          docker run -d --name casper-nctl-2-docker-ci \
            -p 11101-11105:11101-11105 \
            -p 18101-18105:18101-18105 \
            interchouette/casper-nctl-2-docker:dev
          for i in $(seq 1 90); do
            if curl -sS -m 2 -X POST http://127.0.0.1:11101/rpc \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"info_get_status","params":[]}' \
              | grep -q api_version; then
              echo "rpc up"; exit 0
            fi
            sleep 5
          done
          echo "rpc timeout"; exit 1
      - name: Export LOCAL_KEYS_JSON (ops)
        run: |
          chmod +x scripts/export-nctl-local-keys.sh scripts/fund-kms-from-nctl.sh
          test -f "${GITHUB_WORKSPACE}/ceps-rust-ts-client/tests/wasm/cep18/cep18.wasm"
          {
            echo "LOCAL_KEYS_JSON<<EOF"
            NCTL_CONTAINER=casper-nctl-2-docker-ci NCTL_USERS="1 2 3" ./scripts/export-nctl-local-keys.sh
            echo "EOF"
            echo "SIGN_BACKEND=local"
            echo "CEPS_RPC_URL=http://127.0.0.1:11101"
            echo "CEPS_SSE_URL=http://127.0.0.1:18101/events"
            echo "CEPS_CHAIN_NAME=casper-net-1"
            echo "CEPS_WASM_ROOT=${GITHUB_WORKSPACE}/ceps-rust-ts-client/tests/wasm"
          } >> "$GITHUB_ENV"
      - name: Live local (Rust)
        run: env -u CARGO_TARGET_DIR cargo test -p ceps-rust-api --features ${{ env.FEATURES }} --test live_local -- --nocapture
      - name: Start KMS stack (ops)
        run: docker compose -f docker/docker-compose.yml --profile kms up -d kms-localstack kms-secp256k1-api
      - name: Create + fund KMS key (ops)
        run: |
          for i in $(seq 1 60); do
            if curl -sS -m 2 http://127.0.0.1:4000/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          BODY=$(curl -sS -X POST http://127.0.0.1:4000/createKey -H 'content-type: application/json' -d '{}')
          PK=$(echo "$BODY" | jq -r '.publicKey // .public_key // empty')
          test -n "$PK"
          NCTL_CONTAINER=casper-nctl-2-docker-ci ./scripts/fund-kms-from-nctl.sh "$PK"
          {
            echo "SIGN_BACKEND=kms"
            echo "KMS_URL=http://127.0.0.1:4000"
            echo "CEPS_KMS_PUBLIC_KEY=$PK"
          } >> "$GITHUB_ENV"
      - name: Live kms (Rust)
        run: env -u CARGO_TARGET_DIR cargo test -p ceps-rust-api --features ${{ env.FEATURES }} --test live_kms -- --nocapture
